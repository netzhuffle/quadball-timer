name: Deploy environments

on:
  push:
    branches:
      - main
    paths-ignore:
      - AGENTS.md
      - CONTEXT.md
      - README.md
      - docs/**
      - .github/dependabot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timer-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_ARTIFACT: release-${{ github.run_id }}-${{ github.run_attempt }}
  RELEASE_ATTEMPT_ID: sha-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release-artifact: ${{ steps.release-metadata.outputs.release-artifact }}
      release-attempt-id: ${{ steps.release-metadata.outputs.release-attempt-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          install_dir="${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}"
          curl \
            --fail \
            --location \
            --retry 3 \
            --show-error \
            --silent \
            --proto '=https' \
            --tlsv1.2 \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check --status
          tar --extract --file "$archive" --directory "$RUNNER_TEMP"
          shellcheck_path="${install_dir}/shellcheck"
          test -x "$shellcheck_path"
          "$shellcheck_path" --version | grep -Fqx "version: ${SHELLCHECK_VERSION}"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Record immutable release-attempt metadata
        id: release-metadata
        run: |
          set -euo pipefail
          echo "release-artifact=${RELEASE_ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "release-attempt-id=${RELEASE_ATTEMPT_ID}" >> "$GITHUB_OUTPUT"

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build exact Linux executable once
        run: bun run build:executable

      - name: Prepare and verify immutable release bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
        run: bun scripts/create-release-bundle.ts

      - name: Confirm manifest is present in the uploaded bundle
        run: test -s release/release-manifest.json

      - name: Archive bundle while preserving verified modes
        run: |
          set -euo pipefail
          tar --create --gzip --file=release-bundle.tar.gz --directory=release .
          test -s release-bundle.tar.gz

      - name: Upload one shared release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: release-bundle.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-test:
    if: github.ref == 'refs/heads/main'
    needs: build
    outputs:
      status: ${{ steps.deployment-outcome.outputs.status }}
      phase: ${{ steps.deployment-outcome.outputs.phase }}
      releaseAttemptId: ${{ steps.deployment-outcome.outputs.releaseAttemptId }}
      failureCategory: ${{ steps.deployment-outcome.outputs.failureCategory }}
      monitoringDelivery: ${{ steps.deployment-outcome.outputs.monitoringDelivery }}
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://test.timer.quadball.app
    steps:
      - name: Download shared release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.release-artifact }}
          path: .

      - name: Safely extract and verify release bundle modes
        run: |
          set -euo pipefail
          echo "DEPLOYMENT_PHASE=artifact-verification" >> "$GITHUB_ENV"
          archive="release-bundle.tar.gz"
          install -d -m 700 release
          while IFS= read -r member; do
            case "$member" in
              ./) ;;
              ./*)
                relative="${member#./}"
                case "$relative" in
                  ""|/*|../*|*/../*|*/..) echo "Unsafe archive member: ${member}" >&2; exit 1 ;;
                esac
                ;;
              *) echo "Unsafe archive member: ${member}" >&2; exit 1 ;;
            esac
          done < <(tar --list --gzip --file="$archive")
          tar --extract --gzip --file="$archive" --directory=release --no-same-owner
          ! find release -type l -print -quit | grep -q .
          test -x release/quadball-timer
          test -x release/deploy/activate-test-release.sh
          test -x release/deploy/activate-release.sh
          test "$(stat -c '%a' release/quadball-timer)" = 555
          test "$(stat -c '%a' release/deploy/activate-test-release.sh)" = 555
          test "$(stat -c '%a' release/deploy/activate-release.sh)" = 555

      - name: Configure temporary Test SSH material
        env:
          TEST_SSH_KEY: ${{ secrets.TEST_SSH_KEY }}
          TEST_KNOWN_HOSTS: ${{ secrets.TEST_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${TEST_SSH_KEY:?Missing TEST_SSH_KEY secret}"
          : "${TEST_KNOWN_HOSTS:?Missing TEST_KNOWN_HOSTS secret}"
          ssh_dir="${RUNNER_TEMP}/quadball-test-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$TEST_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          printf '%s\n' "$TEST_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 644 "$ssh_dir/known_hosts"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Transfer and activate Test release
        env:
          DEPLOY_HOST: ${{ secrets.TEST_HOST }}
          DEPLOY_USER: ${{ secrets.TEST_USER }}
          DEPLOY_BASE: ${{ vars.TEST_DEPLOY_BASE }}
        run: |
          set -euo pipefail
          echo "DEPLOYMENT_PHASE=staging-and-activation" >> "$GITHUB_ENV"
          : "${DEPLOY_HOST:?Missing TEST_HOST secret}"
          : "${DEPLOY_USER:?Missing TEST_USER secret}"
          base_dir="${DEPLOY_BASE:-/srv/quadball-timer-test}"
          release_id="${RELEASE_ATTEMPT_ID}"
          stage_dir="${base_dir}/.staging/${release_id}"
          ssh_opts="-i ${SSH_DIR}/id_ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${SSH_DIR}/known_hosts -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=1"
          cleanup_remote_stage() {
            ssh $ssh_opts "${DEPLOY_USER}@${DEPLOY_HOST}" "chmod -R u+w -- '${stage_dir}' 2>/dev/null || true; rm -rf -- '${stage_dir}'" || true
            rm -rf -- "$SSH_DIR"
          }
          trap cleanup_remote_stage EXIT
          ssh $ssh_opts "${DEPLOY_USER}@${DEPLOY_HOST}" "test ! -e '${stage_dir}' && install -d -m 750 '${stage_dir}'"
          rsync -a -e "ssh ${ssh_opts}" release/ "${DEPLOY_USER}@${DEPLOY_HOST}:${stage_dir}/"
          set +e
          ssh $ssh_opts "${DEPLOY_USER}@${DEPLOY_HOST}" "'${stage_dir}/deploy/activate-test-release.sh' --base-dir '${base_dir}' --staged-dir '${stage_dir}' --release '${release_id}'" 2>&1 | tee "$RUNNER_TEMP/quadball-test-deployment.log"
          activation_status=${PIPESTATUS[0]}
          set -e
          phase="$(sed -n 's/^ACTIVATION_PHASE=//p' "$RUNNER_TEMP/quadball-test-deployment.log" | tail -n 1)"
          monitoring_delivery="unavailable"
          if (( activation_status != 0 )); then
            sleep 3
            monitoring_delivery="$(timeout --signal=KILL 5s ssh $ssh_opts "${DEPLOY_USER}@${DEPLOY_HOST}" "reporter='${base_dir}/releases/${release_id}'; if [[ ! -x \"\$reporter/quadball-timer\" || ! -f \"\$reporter/release-manifest.json\" ]]; then reporter=\$(readlink -f '${base_dir}/current' 2>/dev/null || true); fi; [[ \"\$reporter\" == '${base_dir}/releases/'* ]] && sudo /usr/local/sbin/quadball-timer-activation-maintenance test \"\$reporter\" read-operational-delivery '${release_id}'" 2>/dev/null || true)"
          fi
          case "$monitoring_delivery" in sent|failed|unavailable) ;; *) monitoring_delivery="unavailable" ;; esac
          echo "DEPLOYMENT_PHASE=${phase:-activation}" >> "$GITHUB_ENV"
          echo "MONITORING_DELIVERY=$monitoring_delivery" >> "$GITHUB_ENV"
          exit "$activation_status"

      - name: Record Test deployment outcome
        id: deployment-outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RELEASE_ATTEMPT: ${{ env.RELEASE_ATTEMPT_ID }}
          FAILED_PHASE: ${{ env.DEPLOYMENT_PHASE }}
          MONITORING_DELIVERY: ${{ env.MONITORING_DELIVERY || 'unavailable' }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success)
              phase="verified"
              failure_category="none"
              ;;
            cancelled)
              phase="${FAILED_PHASE:-deployment}"
              failure_category="cancelled"
              ;;
            *)
              phase="${FAILED_PHASE:-deployment}"
              failure_category="${phase}-failed"
              ;;
          esac
          {
            echo "status=$JOB_STATUS"
            echo "phase=$phase"
            echo "releaseAttemptId=$RELEASE_ATTEMPT"
            echo "failureCategory=$failure_category"
            echo "monitoringDelivery=$MONITORING_DELIVERY"
          } >> "$GITHUB_OUTPUT"

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: build
    outputs:
      status: ${{ steps.deployment-outcome.outputs.status }}
      phase: ${{ steps.deployment-outcome.outputs.phase }}
      releaseAttemptId: ${{ steps.deployment-outcome.outputs.releaseAttemptId }}
      failureCategory: ${{ steps.deployment-outcome.outputs.failureCategory }}
      monitoringDelivery: ${{ steps.deployment-outcome.outputs.monitoringDelivery }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://timer.quadball.app
    steps:
      - name: Download shared release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.release-artifact }}
          path: .

      - name: Safely extract and verify release bundle modes
        run: |
          set -euo pipefail
          echo "DEPLOYMENT_PHASE=artifact-verification" >> "$GITHUB_ENV"
          archive="release-bundle.tar.gz"
          install -d -m 700 release
          while IFS= read -r member; do
            case "$member" in
              ./) ;;
              ./*)
                relative="${member#./}"
                case "$relative" in
                  ""|/*|../*|*/../*|*/..) echo "Unsafe archive member: ${member}" >&2; exit 1 ;;
                esac
                ;;
              *) echo "Unsafe archive member: ${member}" >&2; exit 1 ;;
            esac
          done < <(tar --list --gzip --file="$archive")
          tar --extract --gzip --file="$archive" --directory=release --no-same-owner
          ! find release -type l -print -quit | grep -q .
          test -x release/quadball-timer
          test -x release/deploy/activate-test-release.sh
          test -x release/deploy/activate-release.sh
          test "$(stat -c '%a' release/quadball-timer)" = 555
          test "$(stat -c '%a' release/deploy/activate-test-release.sh)" = 555
          test "$(stat -c '%a' release/deploy/activate-release.sh)" = 555

      - name: Configure temporary Production SSH material
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${PROD_SSH_KEY:?Missing PROD_SSH_KEY secret}"
          : "${PROD_KNOWN_HOSTS:?Missing PROD_KNOWN_HOSTS secret}"
          ssh_dir="${RUNNER_TEMP}/quadball-production-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$PROD_SSH_KEY" > "$ssh_dir/id_ed25519"
          chmod 600 "$ssh_dir/id_ed25519"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 644 "$ssh_dir/known_hosts"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"

      - name: Transfer and activate Production release
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          DEPLOY_BASE: ${{ vars.PROD_DEPLOY_BASE }}
          PROD_SERVICE_NAME: ${{ vars.PROD_SERVICE_NAME }}
          PROD_APP_PORT: ${{ vars.PROD_APP_PORT }}
        run: |
          set -euo pipefail
          echo "DEPLOYMENT_PHASE=staging-and-activation" >> "$GITHUB_ENV"
          : "${DEPLOY_HOST:?Missing PROD_HOST secret}"
          : "${DEPLOY_USER:?Missing PROD_USER secret}"
          base_dir="${DEPLOY_BASE:-/srv/quadball-timer}"
          service_name="${PROD_SERVICE_NAME:-quadball-timer}"
          app_port="${PROD_APP_PORT:-3000}"
          release_id="${RELEASE_ATTEMPT_ID}"
          stage_dir="${base_dir}/.staging/${release_id}"
          ssh_opts="-i ${SSH_DIR}/id_ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${SSH_DIR}/known_hosts -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=1"
          cleanup_remote_stage() {
            ssh $ssh_opts "${DEPLOY_USER}@${DEPLOY_HOST}" "chmod -R u+w -- '${stage_dir}' 2>/dev/null || true; rm -rf -- '${stage_dir}'" || true
            rm -rf -- "$SSH_DIR"
          }
          trap cleanup_remote_stage EXIT
          ssh $ssh_opts "${DEPLOY_USER}@${DEPLOY_HOST}" "test ! -e '${stage_dir}' && install -d -m 750 '${stage_dir}'"
          rsync -a -e "ssh ${ssh_opts}" release/ "${DEPLOY_USER}@${DEPLOY_HOST}:${stage_dir}/"
          set +e
          ssh $ssh_opts "${DEPLOY_USER}@${DEPLOY_HOST}" "'${stage_dir}/deploy/activate-release.sh' --base-dir '${base_dir}' --staged-dir '${stage_dir}' --release '${release_id}' --service '${service_name}' --port '${app_port}'" 2>&1 | tee "$RUNNER_TEMP/quadball-production-deployment.log"
          activation_status=${PIPESTATUS[0]}
          set -e
          phase="$(sed -n 's/^ACTIVATION_PHASE=//p' "$RUNNER_TEMP/quadball-production-deployment.log" | tail -n 1)"
          monitoring_delivery="unavailable"
          if (( activation_status != 0 )); then
            sleep 3
            monitoring_delivery="$(timeout --signal=KILL 5s ssh $ssh_opts "${DEPLOY_USER}@${DEPLOY_HOST}" "reporter='${base_dir}/releases/${release_id}'; if [[ ! -x \"\$reporter/quadball-timer\" || ! -f \"\$reporter/release-manifest.json\" ]]; then reporter=\$(readlink -f '${base_dir}/current' 2>/dev/null || true); fi; [[ \"\$reporter\" == '${base_dir}/releases/'* ]] && sudo /usr/local/sbin/quadball-timer-activation-maintenance production \"\$reporter\" read-operational-delivery '${release_id}'" 2>/dev/null || true)"
          fi
          case "$monitoring_delivery" in sent|failed|unavailable) ;; *) monitoring_delivery="unavailable" ;; esac
          echo "DEPLOYMENT_PHASE=${phase:-activation}" >> "$GITHUB_ENV"
          echo "MONITORING_DELIVERY=$monitoring_delivery" >> "$GITHUB_ENV"
          if (( activation_status != 0 )); then exit "$activation_status"; fi
          curl --fail --silent --show-error --max-time 10 https://timer.quadball.app/ | grep -qi "<!doctype html"

      - name: Record Production deployment outcome
        id: deployment-outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RELEASE_ATTEMPT: ${{ env.RELEASE_ATTEMPT_ID }}
          FAILED_PHASE: ${{ env.DEPLOYMENT_PHASE }}
          MONITORING_DELIVERY: ${{ env.MONITORING_DELIVERY || 'unavailable' }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success)
              phase="verified"
              failure_category="none"
              ;;
            cancelled)
              phase="${FAILED_PHASE:-deployment}"
              failure_category="cancelled"
              ;;
            *)
              phase="${FAILED_PHASE:-deployment}"
              failure_category="${phase}-failed"
              ;;
          esac
          {
            echo "status=$JOB_STATUS"
            echo "phase=$phase"
            echo "releaseAttemptId=$RELEASE_ATTEMPT"
            echo "failureCategory=$failure_category"
            echo "monitoringDelivery=$MONITORING_DELIVERY"
          } >> "$GITHUB_OUTPUT"

  report:
    if: always() && github.ref == 'refs/heads/main'
    needs: [deploy-test, deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: Report both independent environment outcomes
        env:
          RELEASE_ATTEMPT_ID: ${{ env.RELEASE_ATTEMPT_ID }}
          TEST_STATUS: ${{ needs.deploy-test.outputs.status || needs.deploy-test.result }}
          TEST_PHASE: ${{ needs.deploy-test.outputs.phase || 'deployment' }}
          TEST_FAILURE_CATEGORY: ${{ needs.deploy-test.outputs.failureCategory || 'job-skipped' }}
          TEST_MONITORING_DELIVERY: ${{ needs.deploy-test.outputs.monitoringDelivery || 'unavailable' }}
          PRODUCTION_STATUS: ${{ needs.deploy-production.outputs.status || needs.deploy-production.result }}
          PRODUCTION_PHASE: ${{ needs.deploy-production.outputs.phase || 'deployment' }}
          PRODUCTION_FAILURE_CATEGORY: ${{ needs.deploy-production.outputs.failureCategory || 'job-skipped' }}
          PRODUCTION_MONITORING_DELIVERY: ${{ needs.deploy-production.outputs.monitoringDelivery || 'unavailable' }}
        run: |
          set -euo pipefail
          cat > deployment-report.json <<EOF
          {
            "releaseAttemptId": "${RELEASE_ATTEMPT_ID}",
            "test": {
              "status": "${TEST_STATUS}",
              "phase": "${TEST_PHASE}",
              "failureCategory": "${TEST_FAILURE_CATEGORY}",
              "monitoringDelivery": "${TEST_MONITORING_DELIVERY}"
            },
            "production": {
              "status": "${PRODUCTION_STATUS}",
              "phase": "${PRODUCTION_PHASE}",
              "failureCategory": "${PRODUCTION_FAILURE_CATEGORY}",
              "monitoringDelivery": "${PRODUCTION_MONITORING_DELIVERY}"
            }
          }
          EOF
          cat deployment-report.json
          if [[ "$TEST_STATUS" != "success" || "$PRODUCTION_STATUS" != "success" ]]; then
            exit 1
          fi
